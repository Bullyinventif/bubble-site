<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EFF4FA">
<title>Connexion — Bubble Site</title>
<link rel="icon" type="image/png" href="login_icon_1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="bubble_effects.js"></script>
<style>
  body{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }

  .wrap{ position:relative; z-index:1; width:min(430px,100%); display:flex; flex-direction:column; align-items:center; gap:22px; }

  .logo{
    font-size:clamp(2.8rem,10vw,4rem); font-weight:800;
    line-height:1; letter-spacing:-2px;
    display:inline-flex; align-items:baseline; flex-wrap:wrap; justify-content:center;
  }
  .logo span{ text-shadow:0 4px 0 rgba(22,40,63,.08); }
  .logo .t-site{ font-size:.24em; font-weight:800; letter-spacing:2px; color:var(--ink-soft); margin-left:9px; text-shadow:none; }

  .auth-card{
    width:100%; background:var(--surface);
    border:2px solid var(--line); border-radius:var(--r-xl);
    padding:26px 26px 28px; box-shadow:var(--shadow-2);
  }
  .auth-title{ text-align:center; font-size:1.15rem; font-weight:800; margin-bottom:4px; }
  .auth-sub{ text-align:center; font-size:.9rem; font-weight:600; color:var(--ink-soft); margin-bottom:20px; }

  .tabs{ display:flex; gap:8px; margin-bottom:22px; }
  .tab{
    flex:1; padding:11px; border-radius:14px;
    border:2px solid var(--line); background:var(--surface);
    font-family:'Baloo 2',sans-serif; font-size:.95rem; font-weight:800;
    color:var(--ink-soft); cursor:pointer; transition:all .18s;
  }
  .tab:hover{ border-color:var(--line-strong); color:var(--ink); }
  .tab.active{ background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 3px 0 var(--blue-d); }

  .error-msg{
    display:none; margin-bottom:16px;
    background:rgba(255,99,99,.12); border:2px solid rgba(255,99,99,.4);
    color:var(--red-d); border-radius:14px; padding:11px 15px;
    font-size:.88rem; font-weight:700; line-height:1.4;
  }
  .error-msg.show{ display:block; animation:fadeUp .25s ease both; }

  .panel{ display:none; }
  .panel.active{ display:block; animation:fadeUp .25s ease both; }

  .pwd-wrap{ position:relative; }
  .pwd-toggle{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:1.05rem;
    padding:6px; border-radius:8px; line-height:1;
  }
  .pwd-toggle:hover{ background:var(--surface-2); }

  .forgot{
    display:block; text-align:center; margin-top:14px;
    font-size:.85rem; font-weight:700; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; width:100%;
  }
  .forgot:hover{ color:var(--ink); text-decoration:underline; }

  .foot-note{ font-size:.8rem; font-weight:600; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body data-v2>

<div class="wrap">

  <h1 class="logo fade-up">
    <span style="color:#1FA8E8">B</span><span style="color:#FF8A3D">u</span><span style="color:#37C359">b</span><span style="color:#FF4E96">b</span><span style="color:#F5B700">l</span><span style="color:#7E93AC">e</span><span class="t-site">site.</span>
  </h1>

  <div class="auth-card fade-up d1">
    <div class="auth-title">🫧 Bienvenue !</div>
    <div class="auth-sub">Connecte-toi pour retrouver ton profil, tes scans et ta collection.</div>

    <div class="tabs">
      <button class="tab active" id="tabLogin"    onclick="switchTab('login')">Connexion</button>
      <button class="tab"        id="tabRegister" onclick="switchTab('register')">Inscription</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- CONNEXION -->
    <div class="panel active" id="panelLogin">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="ton@email.com">
      </div>
      <div class="field">
        <label for="loginPwd">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="loginPwd" autocomplete="current-password" placeholder="••••••••">
          <button class="pwd-toggle" type="button" onclick="togglePwd('loginPwd',this)" aria-label="Afficher">👁️</button>
        </div>
      </div>
      <button class="btn btn-green btn-block btn-lg" id="btnLogin" onclick="handleLogin()">🚀 Se connecter</button>
      <button class="forgot" onclick="handleReset()">Mot de passe oublié ?</button>
    </div>

    <!-- INSCRIPTION -->
    <div class="panel" id="panelRegister">
      <div class="field">
        <label for="regPseudo">Pseudo</label>
        <input type="text" id="regPseudo" autocomplete="nickname" placeholder="Ton pseudo...">
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" autocomplete="email" placeholder="ton@email.com">
      </div>
      <div class="field">
        <label for="regPwd">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="regPwd" autocomplete="new-password" placeholder="Minimum 6 caractères">
          <button class="pwd-toggle" type="button" onclick="togglePwd('regPwd',this)" aria-label="Afficher">👁️</button>
        </div>
      </div>
      <button class="btn btn-green btn-block btn-lg" id="btnRegister" onclick="handleRegister()">✨ Créer mon compte</button>
    </div>
  </div>

  <div class="foot-note fade-up d2">© BUBBLE INC. · 2026</div>
</div>

<script>
  function switchTab(tab){
    const isLogin = tab === 'login';
    document.getElementById('panelLogin').classList.toggle('active', isLogin);
    document.getElementById('panelRegister').classList.toggle('active', !isLogin);
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    hideError();
  }
  function showError(msg){
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.classList.add('show');
  }
  function hideError(){ document.getElementById('errorMsg').classList.remove('show'); }

  function togglePwd(id, btn){
    const i = document.getElementById(id);
    const show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁️';
  }

  /* Ponts vers le module */
  function handleLogin()   { window._handleLogin    && window._handleLogin(); }
  function handleRegister(){ window._handleRegister && window._handleRegister(); }
  function handleReset()   { window._handleReset    && window._handleReset(); }

  /* Entrée = valider le formulaire visible */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panelLogin').classList.contains('active')) handleLogin();
    else handleRegister();
  });
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
           createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey:"AIzaSyAbtOtU3EZd3yccR8gPCef_wME-5qoNk3Y",
    authDomain:"bubble-game-fa894.firebaseapp.com",
    projectId:"bubble-game-fa894",
    storageBucket:"bubble-game-fa894.firebasestorage.app",
    messagingSenderId:"60256418096",
    appId:"1:60256418096:web:dbdc555819793d8c20f0f5"
  });
  const auth = getAuth(app);
  const db   = getFirestore(app);

  /* Déjà connecté → on file à l'accueil */
  onAuthStateChanged(auth, user => { if (user) window.location.href = './index.html'; });

  const ERRORS = {
    'auth/invalid-email':        '❌ Email invalide.',
    'auth/user-not-found':       '❌ Aucun compte avec cet email.',
    'auth/wrong-password':       '❌ Mot de passe incorrect.',
    'auth/email-already-in-use': '❌ Cet email est déjà utilisé.',
    'auth/weak-password':        '❌ Mot de passe trop faible (min. 6 caractères).',
    'auth/too-many-requests':    '❌ Trop de tentatives. Réessaie dans quelques minutes.',
    'auth/invalid-credential':   '❌ Email ou mot de passe incorrect.',
    'auth/network-request-failed':'❌ Pas de connexion internet.',
    'auth/missing-password':     '⚠️ Entre ton mot de passe.',
  };
  const errMsg = e => ERRORS[e.code] || ('❌ ' + e.message);

  const LABELS = { btnLogin:'🚀 Se connecter', btnRegister:'✨ Créer mon compte' };
  function setLoading(id, on){
    const b = document.getElementById(id);
    b.disabled = on;
    b.textContent = on ? '⏳ Chargement...' : LABELS[id];
  }

  /* ── Connexion ── */
  window._handleLogin = async function(){
    hideError();
    const email = document.getElementById('loginEmail').value.trim();
    const pwd   = document.getElementById('loginPwd').value;
    if (!email || !pwd){ showError('⚠️ Remplis tous les champs !'); return; }
    setLoading('btnLogin', true);
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      /* onAuthStateChanged redirige tout seul */
    } catch(e){
      showError(errMsg(e));
      setLoading('btnLogin', false);
    }
  };

  /* ── Inscription ── */
  window._handleRegister = async function(){
    hideError();
    const pseudo = document.getElementById('regPseudo').value.trim();
    const email  = document.getElementById('regEmail').value.trim();
    const pwd    = document.getElementById('regPwd').value;
    if (!pseudo || !email || !pwd){ showError('⚠️ Remplis tous les champs !'); return; }
    if (pwd.length < 6){ showError('❌ Minimum 6 caractères !'); return; }
    setLoading('btnRegister', true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pwd);
      await updateProfile(cred.user, { displayName: pseudo });
      /* Document utilisateur complet dès la création */
      await setDoc(doc(db,'users',cred.user.uid), {
        pseudo, subscription:'basic', avatarId:'bully_1',
        xp:0, activeEffect:null,
        gachaCollection:[], gachaHistory:[], gachaEffects:[]
      });
    } catch(e){
      showError(errMsg(e));
      setLoading('btnRegister', false);
    }
  };

  /* ── Mot de passe oublié ── */
  window._handleReset = async function(){
    hideError();
    const email = document.getElementById('loginEmail').value.trim();
    if (!email){ showError('⚠️ Entre d\'abord ton email ci-dessus, puis reclique.'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      const el = document.getElementById('errorMsg');
      el.textContent = '📩 Email de réinitialisation envoyé ! Regarde ta boîte mail.';
      el.style.background = 'rgba(70,206,98,.12)';
      el.style.borderColor = 'rgba(70,206,98,.4)';
      el.style.color = 'var(--green-d)';
      el.classList.add('show');
    } catch(e){ showError(errMsg(e)); }
  };
</script>

</body>
</html>
