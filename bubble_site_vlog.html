<style>
  /* ── Post mis en avant ── */
  .featured{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    background:var(--surface); border:2px solid var(--line);
    border-radius:var(--r-xl); overflow:hidden;
    box-shadow:var(--shadow-2); margin-bottom:38px;
  }
  .featured-cover{ position:relative; min-height:280px; background:var(--surface-2);
                   display:flex; align-items:center; justify-content:center; font-size:4rem; }
  .featured-cover img{ width:100%; height:100%; object-fit:cover; }
  .featured-body{ padding:28px; display:flex; flex-direction:column; gap:12px; justify-content:center; }
  .featured-tag{
    align-self:flex-start; padding:5px 13px; border-radius:999px;
    background:rgba(255,95,162,.14); color:var(--pink-d);
    font-size:.75rem; font-weight:800; letter-spacing:.5px;
  }
  .featured-title{ font-size:clamp(1.5rem,3vw,2.1rem); font-weight:800; letter-spacing:-.5px; line-height:1.15; }
  .featured-date{ font-size:.88rem; font-weight:700; color:var(--ink-soft); }
  .featured-desc{ font-size:.98rem; font-weight:600; color:var(--ink-soft); line-height:1.55; }
  .featured-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

  /* ── Liste des posts ── */
  .posts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .post{
    background:var(--surface); border:2px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-1);
    display:flex; flex-direction:column;
    transition:transform .18s, box-shadow .18s;
  }
  .post:hover{ transform:translateY(-4px); box-shadow:var(--shadow-2); }
  .post-cover{ height:150px; background:var(--surface-2); display:flex; align-items:center;
               justify-content:center; font-size:2.6rem; position:relative; }
  .post-cover img{ width:100%; height:100%; object-fit:cover; }
  .post-lock{ position:absolute; inset:0; background:rgba(255,255,255,.72); backdrop-filter:blur(2px);
              display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .post-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .post-date{ font-size:.78rem; font-weight:800; color:var(--pink-d); letter-spacing:.3px; }
  .post-title{ font-size:1.08rem; font-weight:800; line-height:1.25; }
  .post-desc{ font-size:.9rem; font-weight:600; color:var(--ink-soft); line-height:1.45; flex:1; }

  /* ── Aucun post ── */
  .empty{
    background:var(--surface); border:2px dashed var(--line-strong);
    border-radius:var(--r-xl); padding:52px 26px; text-align:center;
  }
  .empty-emoji{ font-size:3.4rem; }
  .empty h2{ font-size:1.3rem; font-weight:800; margin:12px 0 8px; }
  .empty p{ font-size:.98rem; font-weight:600; color:var(--ink-soft); line-height:1.6; max-width:460px; margin:0 auto; }
  .empty code{
    background:var(--surface-2); border:1px solid var(--line);
    padding:2px 7px; border-radius:7px; font-size:.9em; font-weight:700;
  }

  /* ── Lecteur d'un post ── */
  .read-sheet{ width:min(760px,96vw); max-height:90vh; display:flex; flex-direction:column; }
  .read-top{ display:flex; align-items:center; gap:12px; padding:20px 24px 0; flex-shrink:0; }
  .read-top h2{ font-size:1.3rem; font-weight:800; flex:1; line-height:1.2; }
  .read-close{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--line); background:var(--surface);
    font-size:.95rem; font-weight:800; color:var(--ink-soft); cursor:pointer;
  }
  .read-close:hover{ background:var(--surface-2); color:var(--ink); }
  .read-meta{ padding:6px 24px 0; font-size:.85rem; font-weight:700; color:var(--ink-soft); }
  .read-body{ overflow-y:auto; padding:16px 24px 26px; }
  .read-text{ font-size:1rem; font-weight:600; line-height:1.7; white-space:pre-wrap; }
  .read-imgs{ display:grid; gap:12px; margin-top:18px; }
  .read-imgs img{ width:100%; border-radius:var(--r-md); border:2px solid var(--line); display:block; }

  @media(max-width:760px){
    .featured{ grid-template-columns:1fr; }
    .featured-cover{ min-height:180px; max-height:200px; }
    .featured-body{ padding:20px; }
  }
</style>

<script>
/* ── Menu mobile ── */
const toggle=document.getElementById('menuToggle'),menu=document.getElementById('mobileMenu'),ov=document.getElementById('menuOverlay');
function closeMenu(){ menu.classList.remove('open'); ov.classList.remove('open'); }
toggle.addEventListener('click',()=>{const o=menu.classList.contains('open');menu.classList.toggle('open',!o);ov.classList.toggle('open',!o);});
ov.addEventListener('click',closeMenu);
window.addEventListener('resize',()=>{ if(innerWidth>760) closeMenu(); });

let userSub = 'basic';

/* Affiche une date "2026-08-15" → "15 août 2026" */
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function prettyDate(d){
  if (!d) return '';
  const [y,m,j] = String(d).split('-');
  if (!y || !m || !j) return d;
  return `${parseInt(j,10)} ${MOIS[parseInt(m,10)-1]} ${y}`;
}

function canSee(post){ return window.SUB_ORDER[userSub] >= window.SUB_ORDER[post.sub || 'basic']; }

const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Les posts : d'abord ceux du panneau admin (Firestore), sinon window.VLOG */
let POSTS = (window.VLOG || []).slice();

function coverOf(post){
  const src = (post.images || [])[0] || post.cover;
  return src
    ? `<img src="${esc(src)}" alt="${esc(post.title)}" onerror="this.replaceWith(document.createTextNode('🎬'))">`
    : '🎬';
}

/* ── Lecteur ── */
const readOv = document.getElementById('readOverlay');
function openPost(id){
  const p = POSTS.find(x => String(x.id) === String(id));
  if (!p || !canSee(p)) return;
  document.getElementById('readTitle').textContent = p.title || '';
  document.getElementById('readMeta').textContent =
    `${prettyDate(p.date)}${p.author ? ' · par ' + p.author : ''}`;
  document.getElementById('readText').textContent = p.desc || '';
  document.getElementById('readImgs').innerHTML =
    (p.images || []).map(src => `<img src="${esc(src)}" alt="" onerror="this.remove()">`).join('');
  document.getElementById('readVideo').innerHTML = p.video
    ? `<a class="btn btn-red" href="${esc(p.video)}" target="_blank" rel="noopener">▶ Regarder la vidéo</a>` : '';
  readOv.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePost(){ readOv.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('readClose').addEventListener('click', closePost);
readOv.addEventListener('click', e => { if (e.target === readOv) closePost(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePost(); });

function render(){
  const box   = document.getElementById('vlogContent');
  const posts = POSTS.filter(p => p.published !== false);

  if (!posts.length){
    box.innerHTML = `
      <div class="empty fade-up d2">
        <div class="empty-emoji">🎬</div>
        <h2>Le vlog arrive bientôt !</h2>
        <p>Aucun post pour le moment. Reviens vite, ça se prépare dans les coulisses de Bubble inc. !</p>
      </div>`;
    return;
  }

  posts.sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
  const [first, ...rest] = posts;
  const ok = canSee(first);

  const action = ok
    ? `<button class="btn btn-pink btn-lg" data-open="${esc(first.id)}">📖 Lire le post</button>`
    : `<a class="btn btn-yellow btn-lg" href="bubble_site_abonnements.html">🔒 Nécessite ${window.SUB_LABELS[first.sub||'basic']}</a>`;

  box.innerHTML = `
    <section class="featured fade-up d2">
      <div class="featured-cover">${coverOf(first)}</div>
      <div class="featured-body">
        <span class="featured-tag">✦ DERNIER POST</span>
        <div class="featured-title">${esc(first.title)}</div>
        <div class="featured-date">${prettyDate(first.date)}${first.author ? ' · par ' + esc(first.author) : ''}</div>
        <p class="featured-desc">${esc((first.desc||'').slice(0,220))}${(first.desc||'').length > 220 ? '…' : ''}</p>
        <div class="featured-actions">${action}</div>
      </div>
    </section>

    ${rest.length ? `
      <h2 class="section-title fade-up d3">📼 Les posts précédents</h2>
      <div class="posts">
        ${rest.map(p => {
          const vu = canSee(p);
          return `<article class="post fade-up d3">
            <div class="post-cover">
              ${coverOf(p)}
              ${vu ? '' : '<div class="post-lock">🔒</div>'}
            </div>
            <div class="post-body">
              <div class="post-date">${prettyDate(p.date)}</div>
              <div class="post-title">${esc(p.title)}</div>
              <p class="post-desc">${esc((p.desc||'').slice(0,120))}${(p.desc||'').length > 120 ? '…' : ''}</p>
              ${vu
                ? `<button class="btn btn-pink btn-sm" data-open="${esc(p.id)}">📖 Lire</button>`
                : `<a class="btn btn-yellow btn-sm" href="bubble_site_abonnements.html">🔒 ${window.SUB_LABELS[p.sub||'basic']}</a>`}
            </div>
          </article>`;
        }).join('')}
      </div>` : ''}
  `;

  box.querySelectorAll('[data-open]').forEach(b =>
    b.addEventListener('click', () => openPost(b.dataset.open)));
}

render();
</script>

<script type="module">
  import { initializeApp }               from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs }
         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey:"AIzaSyAbtOtU3EZd3yccR8gPCef_wME-5qoNk3Y",
    authDomain:"bubble-game-fa894.firebaseapp.com",
    projectId:"bubble-game-fa894",
    storageBucket:"bubble-game-fa894.firebasestorage.app",
    messagingSenderId:"60256418096",
    appId:"1:60256418096:web:dbdc555819793d8c20f0f5"
  });
  const auth = getAuth(app);
  const db   = getFirestore(app);

  onAuthStateChanged(auth, async user => {
    if (!user){ window.location.href = './login.html'; return; }
    try {
      const snap = await getDoc(doc(db,'users',user.uid));
      if (snap.exists()){
        const d = snap.data();
        const sub = d.subscription || 'basic';
        userSub = sub;
        window.userSub = sub;
        document.getElementById('navAvatar').innerHTML =
          `<img src="${(d.avatarId||'bully_1')}.png" alt="avatar" onerror="this.replaceWith(document.createTextNode('🫧'))">`;
        document.getElementById('navName').textContent = user.displayName || user.email.split('@')[0];
        document.getElementById('navSub').textContent  = window.SUB_LABELS[sub];
        if (window.applyTheme) window.applyTheme(d.activeEffect || null);
        window.applyFrame(sub, window.getLevel(d.xp || 0, sub).level);
      }
    } catch(e){ console.warn(e); }

    /* Les posts publiés depuis le panneau admin.
       S'il n'y en a aucun, on garde ceux écrits à la main dans bubble_data.js. */
    try {
      const snap = await getDocs(collection(db,'vlog'));
      const live = snap.docs.map(s => ({ id:s.id, ...s.data() }));
      if (live.length) POSTS = live;
    } catch(e){ console.warn('Vlog Firestore indisponible :', e); }

    render();
  });
</script>
