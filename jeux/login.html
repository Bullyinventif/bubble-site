<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="../bully_icon_site_1.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <nav>
    <a href="../accueil.html" class="nav-logo">\ud83e\udee7</a>
    <div class="brand">BUBBLE GAME</div>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="jeux.html">Jeux</a>
      <a href="classement.html">Classement</a>
      <a href="credits.html">Cr\u00e9dits</a>
    </div>
    <button class="nav-burger" id="menuToggle" aria-label="Menu">\u2630</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" id="menuClose" aria-label="Fermer">\u2715</button>
    <a href="index.html">Accueil</a>
    <a href="jeux.html">Jeux</a>
    <a href="classement.html">Classement</a>
    <a href="credits.html">Cr\u00e9dits</a>
  </div>

  <div class="wrap">
    <div class="login-wrap">
      <h1>\ud83e\udee7 BUBBLE GAME</h1>
      <p class="login-sub">Connecte-toi pour jouer !</p>
      
      <div class="login-card">
        <div class="tabs">
          <button class="tab active" id="tabLogin" onclick="switchTab('login')">Connexion</button>
          <button class="tab" id="tabRegister" onclick="switchTab('register')">Inscription</button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <!-- CONNEXION -->
        <div class="panel active" id="panelLogin">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" autocomplete="email" placeholder="ton@email.com">
          </div>
          <div class="field">
            <label for="loginPwd">Mot de passe</label>
            <div class="pwd-wrap">
              <input type="password" id="loginPwd" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022">
              <button class="pwd-toggle" type="button" onclick="togglePwd('loginPwd',this)" aria-label="Afficher">\ud83d\udc41\ufe0f</button>
            </div>
          </div>
          <button class="btn btn-lg" id="btnLogin" onclick="handleLogin()">\ud83d\ude80 Se connecter</button>
          <button class="forgot" onclick="handleReset()">Mot de passe oubli\u00e9 ?</button>
        </div>

        <!-- INSCRIPTION -->
        <div class="panel" id="panelRegister">
          <div class="field">
            <label for="regPseudo">Pseudo</label>
            <input type="text" id="regPseudo" autocomplete="nickname" placeholder="Ton pseudo...">
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" autocomplete="email" placeholder="ton@email.com">
          </div>
          <div class="field">
            <label for="regPwd">Mot de passe</label>
            <div class="pwd-wrap">
              <input type="password" id="regPwd" autocomplete="new-password" placeholder="Minimum 6 caract\u00e8res">
              <button class="pwd-toggle" type="button" onclick="togglePwd('regPwd',this)" aria-label="Afficher">\ud83d\udc41\ufe0f</button>
            </div>
          </div>
          <button class="btn btn-lg" id="btnRegister" onclick="handleRegister()">\u2728 Cr\u00e9er mon compte</button>
        </div>
      </div>
    </div>
  </div>

  <footer>\ud83e\udee7 BUBBLE INC. \u2014 <span id="year"></span></footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=5"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
