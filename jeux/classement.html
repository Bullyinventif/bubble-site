<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classement | Bubble Game</title>
  <link rel="icon" type="image/png" href="../bully_icon_site_1.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <nav>
    <a href="./index.html" class="nav-logo">🫧</a>
    <div class="brand">BUBBLE GAME</div>
    <div class="nav-links">
      <a href="https://bubble-site.fr/index.html" class="nav-profile-widget">Accueil</a>
      <a href="./jeux.html">Jeux</a>
      <a href="./classement.html" class="active">Classement</a>
      <a href="./credits.html">Crédits</a>
    </div>
    <a href="https://bubble-site.fr/bubble_site_profil.html" class="nav-profile-widget">
      <div class="nav-profile-info">
        <span class="nav-profile-name" id="navProfileName">...</span>
        <span class="nav-profile-sub" id="navProfileSub">—</span>
      </div>
      <div class="nav-avatar-bubble" id="navAvatarBubble">🧙</div>
    </a>
    <button class="nav-burger" id="menuToggle" aria-label="Menu">☰</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" id="menuClose" aria-label="Fermer">✕</button>
    <a href="https://bubble-site.fr/index.html" class="nav-profile-widget">Accueil</a>
    <a href="./jeux.html">Jeux</a>
    <a href="./classement.html">Classement</a>
    <a href="./credits.html">Crédits</a>
  </div>

  <div class="wrap">
    <div class="rowhead"><h2>🏆 CLASSEMENT DES RECORDS</h2></div>
    <div class="lb-grid" id="lbGrid">
      <div class="empty">Chargement des records…</div>
    </div>
  </div>

  <footer>🫧 BUBBLE INC. — <span id="year"></span></footer>

  <!-- Le classement complet d'un jeu -->
  <div class="lb-overlay" id="lbOverlay">
    <div class="lb-sheet">
      <div class="lb-sheet-top">
        <div class="lb-shot" id="lbSheetShot"></div>
        <div class="lb-title">
          <div class="lb-name" id="lbSheetName">—</div>
          <div class="lb-metric" id="lbSheetMetric">—</div>
        </div>
        <button class="lb-sheet-close" id="lbSheetClose" aria-label="Fermer">✕</button>
      </div>
      <div class="lb-sheet-body" id="lbSheetBody"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=5"></script>
  <script src="games-data.js?v=5"></script>
  <script src="render.js?v=5"></script>
  <script src="leaderboard-data.js?v=5"></script>
  <script src="leaderboard-render.js?v=5"></script>
  <script>
    requireAccess();
    initChrome();

    var GAMES_LB = scoreGamesResolved();
    var scoresByGame = {};   // { bubblecraft: [ {uid,pseudo,avatarId,value}, ... ], ... }
    var currentUid = null;

    function draw() {
      document.getElementById('lbGrid').innerHTML = lbGrid(GAMES_LB, scoresByGame, currentUid);
      document.querySelectorAll('.lb-full-btn').forEach(function (b) {
        b.addEventListener('click', function () { openFull(b.dataset.game); });
      });
    }

    // ── Le classement complet d'un jeu, en modale ──
    var lbOv = document.getElementById('lbOverlay');
    function openFull(scoreId) {
      var cfg = GAMES_LB.find(function (g) { return g.scoreId === scoreId; });
      if (!cfg) return;
      document.getElementById('lbSheetShot').innerHTML =
        '<img src="' + cfg.image + '" alt="" onerror="this.style.opacity=.2">';
      document.getElementById('lbSheetName').textContent = cfg.name;
      document.getElementById('lbSheetMetric').textContent = cfg.label;
      document.getElementById('lbSheetBody').innerHTML =
        lbFullRanking(cfg, scoresByGame[scoreId] || [], currentUid);
      lbOv.classList.add('open');
    }
    function closeFull() { lbOv.classList.remove('open'); }
    document.getElementById('lbSheetClose').addEventListener('click', closeFull);
    lbOv.addEventListener('click', function (e) { if (e.target === lbOv) closeFull(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeFull(); });

    // Premier rendu (avant que Firebase ait répondu)
    draw();

    // ── Firebase : lecture en direct de la collection "scores" ──
    // (requireAccess() a déjà initialisé l'app Firebase, sauf en dev local
    // où il la saute — on s'assure donc qu'elle existe avant de s'en servir.)
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    var auth = firebase.auth();
    var db = firebase.firestore();

    auth.onAuthStateChanged(function (user) { currentUid = user ? user.uid : null; draw(); });

    db.collection('scores').onSnapshot(function (snap) {
      var byGame = {};
      snap.forEach(function (doc) {
        var d = doc.data();
        var g = d.game;
        if (!g) return;
        (byGame[g] = byGame[g] || []).push({
          uid: d.uid, pseudo: d.pseudo, avatarId: d.avatarId, value: Number(d.value) || 0,
        });
      });
      scoresByGame = byGame;
      draw();
    }, function (e) {
      console.warn('Classement — lecture impossible :', e.message);
      document.getElementById('lbGrid').innerHTML =
        '<div class="empty">Impossible de charger le classement pour le moment.</div>';
    });
  </script>
</body>
</html>
