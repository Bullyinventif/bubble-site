<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EFF4FA">
<title>Lecture — Bubble Site</title>
<link rel="icon" type="image/png" href="bully_icon_site_1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="bubble_data.js"></script>
<script type="module" src="bubble_missions.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* Le lecteur a son propre fond neutre : plus confortable pour lire,
     et il n'utilise pas bubble_effects.js (pas de particules pendant la lecture). */
  body{ background:#E8EDF4; min-height:100vh; }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:60px;
    background:rgba(255,255,255,.94); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    padding:0 14px; z-index:1000;
  }
  .topbar-title{
    flex:1; text-align:center; font-weight:800; font-size:1rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);
  }
  .modes{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:14px; border:2px solid var(--line); }
  .mode-btn{
    padding:7px 14px; border-radius:10px; border:none; background:transparent;
    font-family:'Baloo 2',sans-serif; font-size:.86rem; font-weight:800;
    color:var(--ink-soft); cursor:pointer; transition:all .18s; white-space:nowrap;
  }
  .mode-btn.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 4px rgba(22,40,63,.12); }

  #viewer{ padding-top:60px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }

  /* Double page */
  #doubleView{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .spread{
    display:flex; justify-content:center; gap:10px;
    padding:22px 14px; width:100%; max-width:1500px;
  }
  .spread canvas{
    max-width:49%; height:auto; border-radius:8px; background:#fff;
    box-shadow:0 10px 30px rgba(22,40,63,.22);
  }
  .spread canvas.single{ max-width:min(72%,780px); }

  /* Scroll vertical */
  #scrollView{ display:none; flex-direction:column; align-items:center; width:100%; padding:20px 12px 40px; gap:14px; }
  .page-slot{
    width:100%; max-width:900px; background:#fff; border-radius:8px;
    box-shadow:0 8px 24px rgba(22,40,63,.16); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    min-height:200px; color:var(--ink-soft); font-weight:700;
  }
  .page-slot canvas{ width:100%; height:auto; display:block; }

  /* Barre de navigation basse */
  .navbar{
    position:fixed; bottom:0; left:0; right:0; height:64px;
    background:rgba(255,255,255,.94); backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:16px; z-index:1000;
  }
  .nav-round{
    width:48px; height:48px; border-radius:50%;
    border:2px solid var(--line); background:var(--surface);
    font-size:1.3rem; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--line); transition:transform .12s, box-shadow .12s;
  }
  .nav-round:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 5px 0 var(--line); }
  .nav-round:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
  .nav-round:disabled{ opacity:.35; cursor:not-allowed; }

  .page-indicator{ font-size:.95rem; font-weight:800; color:var(--ink); min-width:120px; text-align:center; }
  .page-indicator small{ color:var(--ink-soft); font-weight:700; }

  /* Chargement / erreur */
  #loading, #errorScreen{
    position:fixed; inset:0; background:#E8EDF4; z-index:2000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center;
  }
  #errorScreen{ display:none; }
  .spinner{
    width:52px; height:52px; border-radius:50%;
    border:5px solid var(--line); border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .loading-text{ font-weight:800; color:var(--ink-soft); }
  .error-icon{ font-size:3.4rem; }
  .error-msg{ font-weight:700; color:var(--ink-soft); max-width:420px; line-height:1.5; }

  @media(max-width:760px){
    .topbar{ height:56px; gap:8px; padding:0 10px; }
    .topbar-title{ font-size:.86rem; }
    .mode-btn{ padding:6px 10px; font-size:.78rem; }
    .btn-back-label{ display:none; }
    #viewer{ padding-top:56px; }
    .spread{ padding:12px 6px; gap:5px; }
    .navbar{ height:58px; gap:12px; }
    .nav-round{ width:42px; height:42px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Chargement du scan...</div>
</div>

<div id="errorScreen">
  <div class="error-icon">😵</div>
  <div class="error-msg" id="errorMsg">Le fichier PDF n'a pas pu être chargé.</div>
  <a href="bubble_site_scans.html" class="btn btn-green">← Retour aux scans</a>
</div>

<div class="topbar">
  <a href="bubble_site_scans.html" class="btn btn-ghost btn-sm">←<span class="btn-back-label"> Retour</span></a>
  <div class="topbar-title" id="topbarTitle">Chargement...</div>
  <div class="modes">
    <button class="mode-btn active" id="btnDouble" onclick="setMode('double')">📖 Double</button>
    <button class="mode-btn"        id="btnScroll" onclick="setMode('scroll')">📜 Scroll</button>
  </div>
</div>

<div id="viewer">
  <div id="doubleView"><div class="spread" id="spread"></div></div>
  <div id="scrollView"></div>
</div>

<div class="navbar" id="navbar">
  <button class="nav-round" id="btnPrev" onclick="prevSpread()" aria-label="Page précédente">‹</button>
  <div class="page-indicator" id="pageIndicator">— <small>/ —</small></div>
  <button class="nav-round" id="btnNext" onclick="nextSpread()" aria-label="Page suivante">›</button>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params  = new URLSearchParams(location.search);
const pdfUrl  = params.get('pdf');
const title   = params.get('title') || 'Lecture';
const scanId  = params.get('id');          /* sert à enregistrer la progression */

document.getElementById('topbarTitle').textContent = title;
document.title = title + ' — Bubble Site';

let pdfDoc = null, totalPages = 0, currentSpread = 0, mode = 'double';
const SCALE = 1.8;

/* ── Chargement ── */
async function loadPDF(){
  if (!pdfUrl){ showError("Aucun fichier PDF indiqué dans l'adresse."); return; }
  try {
    pdfDoc     = await pdfjsLib.getDocument(pdfUrl).promise;
    totalPages = pdfDoc.numPages;

    /* Reprise : on rouvre là où on s'était arrêté */
    const prog = window.progressOf && window.progressOf(scanId);
    if (prog && prog.page > 1 && prog.page <= totalPages){
      currentSpread = Math.floor((prog.page - 1) / 2);
    }

    document.getElementById('loading').style.display = 'none';
    await renderDouble();
    buildScrollSlots();

    /* Mission : ce scan est lu (+XP la première fois) */
    if (scanId && window.BubbleMissions) window.BubbleMissions.scanRead(scanId);
  } catch(e){
    showError('Impossible de charger le PDF : ' + e.message);
  }
}

/* ── Dessine une page dans un canvas ── */
async function renderPage(num, canvas){
  const page     = await pdfDoc.getPage(num);
  const viewport = page.getViewport({ scale: SCALE });
  canvas.width  = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
}

/* ── Mode double page ── */
async function renderDouble(){
  const spread = document.getElementById('spread');
  spread.innerHTML = '';
  const p1 = currentSpread * 2 + 1;
  const p2 = p1 + 1;

  if (p1 <= totalPages){
    const c = document.createElement('canvas');
    if (p2 > totalPages) c.classList.add('single');   /* dernière page seule : plus large */
    spread.appendChild(c);
    await renderPage(p1, c);
  }
  if (p2 <= totalPages){
    const c = document.createElement('canvas');
    spread.appendChild(c);
    await renderPage(p2, c);
  }
  updateNav();
  trackPage(p1);
}

function prevSpread(){ if (currentSpread > 0){ currentSpread--; renderDouble(); window.scrollTo({top:0,behavior:'smooth'}); } }
function nextSpread(){
  const max = Math.ceil(totalPages / 2) - 1;
  if (currentSpread < max){ currentSpread++; renderDouble(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function updateNav(){
  const p1 = currentSpread * 2 + 1;
  const p2 = Math.min(p1 + 1, totalPages);
  document.getElementById('pageIndicator').innerHTML =
    (p1 === p2 ? `${p1}` : `${p1}-${p2}`) + ` <small>/ ${totalPages}</small>`;
  document.getElementById('btnPrev').disabled = currentSpread === 0;
  document.getElementById('btnNext').disabled = currentSpread >= Math.ceil(totalPages / 2) - 1;
}

/* ── Mode scroll : les pages se dessinent quand elles approchent de l'écran ──
   (avant, les 24 pages étaient rendues d'un coup au chargement : très lourd) */
let observer = null;
function buildScrollSlots(){
  const sv = document.getElementById('scrollView');
  sv.innerHTML = '';
  if (observer) observer.disconnect();

  for (let i = 1; i <= totalPages; i++){
    const slot = document.createElement('div');
    slot.className = 'page-slot';
    slot.dataset.page = i;
    slot.textContent = 'Page ' + i;
    sv.appendChild(slot);
  }

  observer = new IntersectionObserver(entries => {
    entries.forEach(async entry => {
      const slot = entry.target;
      if (!entry.isIntersecting) return;

      /* Suit la page lue pour la sauvegarde */
      if (mode === 'scroll' && entry.intersectionRatio > .5) trackPage(+slot.dataset.page);

      if (slot.dataset.done) return;
      slot.dataset.done = '1';
      const c = document.createElement('canvas');
      await renderPage(+slot.dataset.page, c);
      slot.textContent = '';
      slot.appendChild(c);
    });
  }, { rootMargin: '900px 0px', threshold: [0, .55] });

  sv.querySelectorAll('.page-slot').forEach(s => observer.observe(s));
}

/* ── Sauvegarde de la progression (au max 1 écriture/seconde) ──
   ⚠️ Ne pas renommer en saveProgress : ça écraserait window.saveProgress
   défini dans bubble_data.js (la fonction s'appellerait elle-même). */
let lastSaved = 0, lastPage = 0;
function trackPage(page){
  if (!scanId || !window.saveProgress) return;
  const now = Date.now();
  if (page === lastPage || now - lastSaved < 800) return;
  lastPage = page; lastSaved = now;
  window.saveProgress(scanId, page, totalPages);
}

/* ── Changement de mode ── */
function setMode(m){
  mode = m;
  const isDouble = m === 'double';
  document.getElementById('doubleView').style.display = isDouble ? 'flex' : 'none';
  document.getElementById('scrollView').style.display = isDouble ? 'none' : 'flex';
  document.getElementById('navbar').style.display     = isDouble ? 'flex' : 'none';
  document.getElementById('viewer').style.paddingBottom = isDouble ? '70px' : '20px';
  document.getElementById('btnDouble').classList.toggle('active', isDouble);
  document.getElementById('btnScroll').classList.toggle('active', !isDouble);

  /* On garde la page en changeant de mode */
  if (!isDouble){
    const target = document.querySelector(`.page-slot[data-page="${currentSpread*2+1}"]`);
    if (target) setTimeout(() => target.scrollIntoView({ block:'start' }), 60);
  } else {
    if (lastPage) currentSpread = Math.floor((lastPage - 1) / 2);
    renderDouble();
  }
}

/* ── Clavier ── */
document.addEventListener('keydown', e => {
  if (mode !== 'double') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') nextSpread();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  prevSpread();
});

/* ── Balayage tactile ── */
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive:true });
document.addEventListener('touchend', e => {
  if (mode !== 'double' || touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) dx < 0 ? nextSpread() : prevSpread();
  touchX = null;
}, { passive:true });

function showError(msg){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'flex';
  document.getElementById('errorMsg').textContent = msg;
}

loadPDF();
</script>
</body>
</html>
